[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commandcode-proxy"
version = "1.0.0"
description = "OpenAI-compatible proxy for the CommandCode API (Python port)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
commandcode-proxy = "commandcode_proxy.main:main"

[tool.hatch.build.targets.wheel]
packages = ["commandcode_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
